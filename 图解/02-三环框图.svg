<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三环级联控制框图(全书最重要的一张图)</text>
  <line x1="20" y1="180" x2="88" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="52" y="168" text-anchor="middle" font-size="13" fill="#334155">位置指令 θ*</text>
  <circle cx="112" cy="180" r="17" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="104" y="172" font-size="14" fill="#1d4ed8">+</text>
  <text x="104" y="196" font-size="14" fill="#1d4ed8">−</text>
  <rect x="150" y="150" width="120" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="210" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">位置环 P</text>
  <text x="210" y="196" text-anchor="middle" font-size="13" fill="#1d4ed8">增益 Kp</text>
  <line x1="270" y1="180" x2="308" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="289" y="168" text-anchor="middle" font-size="12" fill="#475569">ω*</text>
  <circle cx="330" cy="180" r="17" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="322" y="172" font-size="14" fill="#166534">+</text>
  <text x="322" y="196" font-size="14" fill="#166534">−</text>
  <rect x="368" y="150" width="130" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="433" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">速度环 PI</text>
  <text x="433" y="190" text-anchor="middle" font-size="13" fill="#166534">Kv、Ti</text>
  <line x1="498" y1="180" x2="536" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="517" y="168" text-anchor="middle" font-size="12" fill="#475569">T*</text>
  <circle cx="558" cy="180" r="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="550" y="172" font-size="14" fill="#9a3412">+</text>
  <text x="550" y="196" font-size="14" fill="#9a3412">−</text>
  <rect x="596" y="150" width="130" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="661" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">电流环 PI</text>
  <text x="661" y="190" text-anchor="middle" font-size="13" fill="#9a3412">(出厂调好,勿动)</text>
  <line x1="726" y1="180" x2="760" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="764" y="150" width="130" height="60" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="829" y="176" text-anchor="middle" font-size="15" fill="#334155">电机+负载</text>
  <text x="829" y="196" text-anchor="middle" font-size="12" fill="#64748b">功率PWM驱动</text>
  <path d="M 330 120 L 330 163" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="330" y="108" text-anchor="middle" font-size="12" fill="#7e22ce">速度前馈(第10章,可选)</text>
  <path d="M 558 120 L 558 163" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="558" y="108" text-anchor="middle" font-size="12" fill="#7e22ce">转矩前馈(可选)</text>
  <rect x="764" y="270" width="130" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="829" y="291" text-anchor="middle" font-size="14" fill="#334155">编码器</text>
  <text x="829" y="309" text-anchor="middle" font-size="11" fill="#64748b">位置+速度反馈</text>
  <line x1="829" y1="210" x2="829" y2="266" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 829 210 L 829 244 L 558 244 L 558 201" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#c)"/>
  <path d="M 829 320 L 829 360 L 112 360 L 112 201" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#c)"/>
  <path d="M 829 320 L 829 375 L 330 375 L 330 201" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#c)"/>
  <rect x="648" y="226" width="90" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="693" y="238" text-anchor="middle" font-size="12" fill="#64748b">电流反馈</text>
  <rect x="110" y="340" width="64" height="15" fill="#ffffff" opacity="0.9"/>
  <text x="115" y="352" text-anchor="start" font-size="12" fill="#64748b">位置反馈</text>
  <rect x="328" y="355" width="64" height="15" fill="#ffffff" opacity="0.9"/>
  <text x="333" y="367" text-anchor="start" font-size="12" fill="#64748b">速度反馈</text>
  <text x="460" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">外环的输出 = 内环的给定:位置环喊速度,速度环喊转矩,电流环出手</text>
  <text x="460" y="448" text-anchor="middle" font-size="13" fill="#94a3b8">带宽阶梯:电流环 500Hz~几kHz ≫ 速度环 30~300Hz ≫ 位置环 5~50Hz(内环必须远快于外环)</text>
</svg>
