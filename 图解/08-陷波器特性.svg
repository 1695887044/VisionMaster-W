<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">陷波器:只切一个点的手术刀(三个旋钮)</text>
  <line x1="90" y1="330" x2="830" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#q)"/>
  <text x="830" y="352" text-anchor="end" font-size="12" fill="#334155">频率(对数) →</text>
  <line x1="90" y1="330" x2="90" y2="70" stroke="#334155" stroke-width="2" marker-end="url(#q)"/>
  <text x="82" y="80" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 82 115)">增益(dB)</text>
  <text x="84" y="104" text-anchor="end" font-size="12" fill="#64748b">0 dB(不变)</text>
  <text x="84" y="212" text-anchor="end" font-size="12" fill="#64748b">−20 dB(1/10)</text>
  <text x="84" y="286" text-anchor="end" font-size="12" fill="#64748b">−40 dB(1/100)</text>
  <path d="M 90 104 L 340 104 C 400 106 420 120 445 140 C 470 160 480 208 500 208 C 520 208 530 160 555 140 C 580 120 600 106 660 104 L 830 104" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="105" y="170" text-anchor="start" font-size="13" fill="#2563eb" font-weight="bold">Q=10 窄口</text>
  <text x="105" y="192" text-anchor="start" font-size="12" fill="#2563eb">频率稳时用:邻频无伤、增益抬得回最高</text>
  <text x="105" y="228" text-anchor="start" font-size="13" fill="#ea580c" font-weight="bold">Q=2 宽口</text>
  <text x="105" y="250" text-anchor="start" font-size="12" fill="#ea580c">频率漂移时用(长丝杠/皮带):漂移也切得住</text>
  <path d="M 90 118 L 300 118 C 370 122 400 170 445 220 C 480 258 520 258 555 220 C 600 170 630 122 700 118 L 830 118" fill="none" stroke="#ea580c" stroke-width="3"/>
  <line x1="500" y1="70" x2="500" y2="330" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="500" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">f0 中心频率 = 实测共振频率</text>
  <line x1="540" y1="208" x2="540" y2="330" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="460" y1="208" x2="460" y2="330" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M 460 316 L 540 316" stroke="#475569" stroke-width="1.6" marker-end="url(#q)"/>
  <path d="M 540 316 L 462 316" stroke="#475569" stroke-width="1.6" marker-end="url(#q)"/>
  <text x="500" y="308" text-anchor="middle" font-size="12" fill="#475569">带宽 = f0 / Q</text>
  <path d="M 560 208 L 560 244" stroke="#7e22ce" stroke-width="2" marker-end="url(#q)"/>
  <text x="568" y="242" font-size="12" fill="#7e22ce">深度:切多深(−20dB=压到1/10)</text>
  <text x="440" y="396" text-anchor="middle" font-size="13" fill="#334155">取舍:Q 高(窄)→邻频无伤、增益抬得回最高,但频率一漂就切空;Q 低(宽)→漂移也切得住,但伤无辜、抬回的增益少</text>
  <text x="440" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">治共振的最终目的不是"不叫",而是把增益天花板抬回去</text>
</svg>
