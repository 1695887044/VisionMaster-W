<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="920" height="380" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">惯量比难度地图:R = 负载折算惯量 ÷ 电机转子惯量</text>
  <rect x="50" y="80" width="130" height="130" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">R &lt; 3</text>
  <text x="115" y="130" text-anchor="middle" font-size="13" fill="#1e40af">极好调</text>
  <text x="115" y="152" text-anchor="middle" font-size="13" fill="#1e40af">★</text>
  <text x="115" y="176" text-anchor="middle" font-size="11" fill="#3730a3">自调谐一把过</text>
  <text x="115" y="194" text-anchor="middle" font-size="11" fill="#3730a3">警惕静止微抖</text>
  <rect x="186" y="80" width="150" height="130" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="261" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">R = 3~10</text>
  <text x="261" y="130" text-anchor="middle" font-size="13" fill="#166534">甜点区</text>
  <text x="261" y="152" text-anchor="middle" font-size="13" fill="#166534">★★</text>
  <text x="261" y="176" text-anchor="middle" font-size="11" fill="#15803d">增益到中上水平</text>
  <text x="261" y="194" text-anchor="middle" font-size="11" fill="#15803d">一般用不上陷波</text>
  <rect x="342" y="80" width="160" height="130" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="422" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#854d0e">R = 10~30</text>
  <text x="422" y="130" text-anchor="middle" font-size="13" fill="#854d0e">工业常态</text>
  <text x="422" y="152" text-anchor="middle" font-size="13" fill="#854d0e">★★★</text>
  <text x="422" y="176" text-anchor="middle" font-size="11" fill="#a16207">偶发啸叫/毛刺</text>
  <text x="422" y="194" text-anchor="middle" font-size="11" fill="#a16207">预备 1 个陷波器</text>
  <rect x="508" y="80" width="160" height="130" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="588" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">R = 30~50</text>
  <text x="588" y="130" text-anchor="middle" font-size="13" fill="#9a3412">困难区</text>
  <text x="588" y="152" text-anchor="middle" font-size="13" fill="#9a3412">★★★★</text>
  <text x="588" y="176" text-anchor="middle" font-size="11" fill="#c2410c">自调谐一跑就震</text>
  <text x="588" y="194" text-anchor="middle" font-size="11" fill="#c2410c">手动+认真查机械</text>
  <rect x="674" y="80" width="196" height="130" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="772" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">R &gt; 50</text>
  <text x="772" y="130" text-anchor="middle" font-size="13" fill="#991b1b">专家区</text>
  <text x="772" y="152" text-anchor="middle" font-size="13" fill="#991b1b">★★★★★</text>
  <text x="772" y="176" text-anchor="middle" font-size="11" fill="#b91c1c">"又肉又震"并存</text>
  <text x="772" y="194" text-anchor="middle" font-size="11" fill="#b91c1c">正确答案常是改机械</text>
  <line x1="50" y1="248" x2="870" y2="248" stroke="#334155" stroke-width="2.5" marker-end="url(#e)"/>
  <text x="460" y="274" text-anchor="middle" font-size="14" fill="#334155">惯量比 R 增大 →</text>
  <text x="460" y="298" text-anchor="middle" font-size="13" fill="#64748b">共振频率往低频走(贴近工作频段) · 增益天花板降低 · 调试难度上升</text>
  <text x="460" y="336" text-anchor="middle" font-size="13" fill="#94a3b8">惯量比填错的症状:填小 → 震;填大 → 肉。口诀:机械一动,辨识重做</text>
</svg>
