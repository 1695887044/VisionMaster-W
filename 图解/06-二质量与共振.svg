<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">二质量系统:传动链是"弹簧",不是刚体</text>
  <circle cx="130" cy="150" r="52" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="130" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">电机</text>
  <text x="130" y="166" text-anchor="middle" font-size="13" fill="#1e40af">Jm</text>
  <polyline points="182,150 196,128 212,172 228,128 244,172 260,128 274,150" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="228" y="112" text-anchor="middle" font-size="12" fill="#b91c1c">扭转刚度 K + 阻尼</text>
  <rect x="278" y="110" width="120" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="338" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">负载</text>
  <text x="338" y="166" text-anchor="middle" font-size="13" fill="#15803d">JL</text>
  <text x="228" y="222" text-anchor="middle" font-size="12" fill="#64748b">联轴节/皮带/丝杠 = 看不见的弹簧</text>
  <text x="228" y="262" text-anchor="middle" font-size="13" fill="#334155">猛推电机 → 弹簧先扭一下 → 能量在两个惯量间来回弹 → 共振</text>
  <line x1="470" y1="330" x2="890" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#h)"/>
  <text x="890" y="352" text-anchor="end" font-size="12" fill="#334155">频率(Hz,对数) →</text>
  <line x1="470" y1="330" x2="470" y2="70" stroke="#334155" stroke-width="2" marker-end="url(#h)"/>
  <text x="460" y="80" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 460 110)">增益(dB)</text>
  <path d="M 490 160 C 530 162 540 288 565 290 C 585 291 590 96 618 92 C 640 89 660 250 700 290 C 740 322 800 326 880 328" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="565" y1="290" x2="565" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="618" y1="92" x2="618" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="565" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">ωa 反谐振</text>
  <text x="618" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">ωr 谐振</text>
  <text x="640" y="80" text-anchor="middle" font-size="12" fill="#b91c1c">共振峰:必须压下去</text>
  <rect x="446" y="252" width="104" height="16" fill="#ffffff" opacity="0.88"/>
  <text x="545" y="264" text-anchor="end" font-size="12" fill="#64748b">凹点:负载"失联"</text>
  <rect x="588" y="108" width="184" height="92" fill="#ffffff" opacity="0.88"/>
  <text x="680" y="120" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold">ωa = √(K / JL)</text>
  <text x="680" y="142" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold">ωr = ωa × √(1+R)</text>
  <text x="680" y="170" text-anchor="middle" font-size="12" fill="#64748b">例:K=1000,Jm=1×10⁻⁴,JL=5×10⁻⁴(R=5)</text>
  <text x="680" y="190" text-anchor="middle" font-size="12" fill="#64748b">→ ωa≈225Hz,ωr≈551Hz</text>
  <text x="460" y="404" text-anchor="middle" font-size="13" fill="#94a3b8">R 越大,ωa 和 ωr 都往低频走、互相靠近 → 共振贴近工作频段 → 这就是"惯量比大=天花板低"的数学根源</text>
</svg>
