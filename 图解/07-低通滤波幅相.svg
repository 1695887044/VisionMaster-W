<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">一阶低通滤波器:幅频与相位的双刃剑</text>
  <line x1="100" y1="200" x2="820" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>
  <text x="820" y="222" text-anchor="end" font-size="12" fill="#334155">频率(对数) →</text>
  <line x1="100" y1="200" x2="100" y2="60" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>
  <text x="92" y="70" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 92 105)">增益(dB)</text>
  <text x="94" y="98" text-anchor="end" font-size="12" fill="#64748b">0 dB = 1倍</text>
  <path d="M 100 96 L 430 96 C 500 98 520 130 560 165 C 600 200 660 250 820 278" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="430" y1="96" x2="430" y2="200" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="430" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">fc = 1/(2πτ)</text>
  <text x="300" y="88" text-anchor="middle" font-size="12" fill="#2563eb">fc 以下:基本放行</text>
  <text x="680" y="240" text-anchor="middle" font-size="12" fill="#2563eb">fc 以上:逐步压制</text>
  <text x="640" y="118" text-anchor="middle" font-size="13" fill="#334155">τ=1ms → fc≈159Hz · τ=5ms → fc≈32Hz</text>
  <line x1="100" y1="430" x2="820" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>
  <text x="820" y="452" text-anchor="end" font-size="12" fill="#334155">频率(对数) →</text>
  <line x1="100" y1="430" x2="100" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#p)"/>
  <text x="92" y="300" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 92 335)">相位滞后</text>
  <text x="94" y="306" text-anchor="end" font-size="12" fill="#64748b">0°</text>
  <text x="94" y="366" text-anchor="end" font-size="12" fill="#64748b">−45°</text>
  <text x="94" y="426" text-anchor="end" font-size="12" fill="#64748b">−90°</text>
  <path d="M 100 306 C 300 308 360 340 430 366 C 500 392 560 416 820 424" fill="none" stroke="#ea580c" stroke-width="3"/>
  <line x1="430" y1="290" x2="430" y2="430" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  <circle cx="430" cy="366" r="6" fill="#ea580c"/>
  <text x="452" y="356" font-size="13" font-weight="bold" fill="#ea580c">在 fc 处恰好滞后 45°</text>
  <text x="452" y="306" font-size="12" fill="#c2410c">例:带宽100Hz的系统配τ=1ms滤波</text>
  <text x="452" y="324" font-size="12" fill="#c2410c">在100Hz处已吃掉约32°相位裕度</text>
  <text x="440" y="472" text-anchor="middle" font-size="13" fill="#94a3b8">滤波不是免费的:每一点平滑都在吃相位裕度 → fc 至少设在系统带宽 5 倍以外</text>
</svg>
