<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">伯德图与相位裕度:"调大就炸"的完整解释</text>
  <line x1="100" y1="210" x2="830" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#r)"/>
  <text x="830" y="232" text-anchor="end" font-size="12" fill="#334155">频率(对数) →</text>
  <line x1="100" y1="210" x2="100" y2="60" stroke="#334155" stroke-width="2" marker-end="url(#r)"/>
  <text x="94" y="96" text-anchor="end" font-size="12" fill="#64748b">+40dB</text>
  <line x1="100" y1="140" x2="830" y2="140" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="826" y="134" text-anchor="end" font-size="12" fill="#64748b">0 dB(1倍)</text>
  <path d="M 100 66 C 250 70 330 108 420 140 C 520 176 640 220 830 260" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="420" y1="140" x2="420" y2="210" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="420" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">穿越频率 fc = 系统实际带宽</text>
  <text x="200" y="88" text-anchor="middle" font-size="12" fill="#2563eb">总环路增益</text>
  <text x="470" y="262" text-anchor="start" font-size="12" fill="#2563eb">加增益 = 把 fc 往右(高频)推</text>
  <line x1="100" y1="450" x2="830" y2="450" stroke="#334155" stroke-width="2" marker-end="url(#r)"/>
  <text x="830" y="472" text-anchor="end" font-size="12" fill="#334155">频率(对数) →</text>
  <line x1="100" y1="450" x2="100" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#r)"/>
  <text x="94" y="304" text-anchor="end" font-size="12" fill="#64748b">−90°</text>
  <text x="94" y="374" text-anchor="end" font-size="12" fill="#64748b">−135°</text>
  <text x="94" y="446" text-anchor="end" font-size="12" fill="#64748b">−180°(自激临界)</text>
  <line x1="100" y1="410" x2="830" y2="410" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="8 5"/>
  <path d="M 100 300 C 260 302 340 330 420 356 C 520 386 620 404 830 410" fill="none" stroke="#ea580c" stroke-width="3"/>
  <line x1="420" y1="290" x2="420" y2="450" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <circle cx="420" cy="356" r="6" fill="#ea580c"/>
  <path d="M 420 356 L 420 404" stroke="#16a34a" stroke-width="3" marker-end="url(#r)"/>
  <text x="436" y="392" font-size="14" font-weight="bold" fill="#16a34a">相位裕度 PM</text>
  <rect x="432" y="400" width="250" height="16" fill="#ffffff" opacity="0.9"/><text x="436" y="412" font-size="12" fill="#15803d">fc 处离 −180° 的距离,≥45° 安全</text>
  <path d="M 740 410 L 740 336" stroke="#7e22ce" stroke-width="2.4" marker-end="url(#r)"/>
  <text x="752" y="352" font-size="13" font-weight="bold" fill="#7e22ce">增益裕度 GM</text>
  <text x="752" y="372" font-size="12" fill="#7e22ce">−180°处还能加的dB,≥6dB(2倍)</text>
  <circle cx="740" cy="238" r="5" fill="#7e22ce"/>
  <text x="440" y="494" text-anchor="middle" font-size="13" fill="#94a3b8">加增益 → fc 右移 → 高频相位滞后本来就大(滤波/延迟/共振) → PM 耗尽 → 震荡。增益没错,错的是相位账户余额不够</text>
</svg>
