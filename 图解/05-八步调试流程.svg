<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">八步调试流程</text>
  <rect x="40" y="70" width="170" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="125" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">① 准备</text>
  <text x="125" y="114" text-anchor="middle" font-size="11" fill="#15803d">安全/备份/查机械</text>
  <line x1="210" y1="99" x2="248" y2="99" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <rect x="252" y="70" width="170" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="337" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">② 惯量辨识</text>
  <text x="337" y="114" text-anchor="middle" font-size="11" fill="#15803d">带满负载,R 对号入座</text>
  <line x1="422" y1="99" x2="460" y2="99" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <rect x="464" y="70" width="170" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="549" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">③ 自动调谐打底</text>
  <text x="549" y="114" text-anchor="middle" font-size="11" fill="#15803d">拿到"及格线"增益</text>
  <line x1="634" y1="99" x2="672" y2="99" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <rect x="676" y="70" width="164" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="758" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">④ 调速度环</text>
  <text x="758" y="114" text-anchor="middle" font-size="11" fill="#1e40af">Kv→Ti,临界回退</text>
  <path d="M 758 128 L 758 168 L 125 168 L 125 208" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <rect x="40" y="212" width="170" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="125" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">⑤ 调位置环</text>
  <text x="125" y="256" text-anchor="middle" font-size="11" fill="#1e40af">Kp≤速度带宽/3~5</text>
  <line x1="210" y1="241" x2="248" y2="241" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <rect x="252" y="212" width="170" height="58" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="337" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">⑥ 调前馈</text>
  <text x="337" y="256" text-anchor="middle" font-size="11" fill="#7e22ce">S曲线→速度FF→转矩FF</text>
  <line x1="422" y1="241" x2="460" y2="241" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <polygon points="549,212 619,241 549,270 479,241" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="549" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">⑦ 有啸叫?</text>
  <line x1="619" y1="241" x2="672" y2="241" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <text x="645" y="230" text-anchor="middle" font-size="11" fill="#c2410c">是</text>
  <rect x="676" y="212" width="164" height="58" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="758" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">⑦ 治共振</text>
  <text x="758" y="256" text-anchor="middle" font-size="11" fill="#c2410c">FFT→陷波→抬回增益</text>
  <path d="M 758 212 L 758 180 L 549 180 L 549 196" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="650" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">治完回来⑥微调</text>
  <text x="645" y="290" text-anchor="middle" font-size="11" fill="#64748b">否</text>
  <path d="M 549 270 L 549 320" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
  <rect x="252" y="324" width="380" height="58" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="442" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">⑧ 验收:超调/整定/误差/温升</text>
  <text x="442" y="368" text-anchor="middle" font-size="11" fill="#64748b">变条件复测:不同速度·行程·正反向·空/带载</text>
  <text x="440" y="408" text-anchor="middle" font-size="13" fill="#94a3b8">铁律:先内环后外环 · 先P后I · 一次一个参数 · 临界回退20~30%</text>
</svg>
