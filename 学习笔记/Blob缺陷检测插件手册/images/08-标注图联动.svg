<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="370" fill="#FDFDFB"/>
  <!-- 左：标注图 -->
  <text x="30" y="28" fill="#0F172A" font-size="15" font-weight="bold">标注图 DefectImage（产线屏幕直接看）</text>
  <rect x="30" y="44" width="360" height="260" fill="#D9DDE2" stroke="#64748B" stroke-width="2"/>
  <!-- 判定文字（白底框） -->
  <rect x="42" y="54" width="200" height="58" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="52" y="74" fill="#B91C1C" font-size="13" font-weight="bold">NG：缺陷 3 个（上限 0）</text>
  <text x="52" y="92" fill="#334155" font-size="11.5">MaxArea 112.3 ｜ Total 243.8</text>
  <text x="52" y="106" fill="#334155" font-size="11.5">零容忍：见 NG 先填规格</text>
  <!-- 三个缺陷 + 红圈 + 编号 -->
  <circle cx="180" cy="180" r="18" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <text x="204" y="186" fill="#DC2626" font-size="13" font-weight="bold">1</text>
  <ellipse cx="330" cy="120" rx="24" ry="10" fill="none" stroke="#DC2626" stroke-width="2.5" transform="rotate(-18 330 120)"/>
  <text x="360" y="124" fill="#DC2626" font-size="13" font-weight="bold">2</text>
  <circle cx="420" cy="260" r="14" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <text x="440" y="266" fill="#DC2626" font-size="13" font-weight="bold">3</text>
  <!-- 黄框联动（缺陷2） -->
  <rect x="298" y="102" width="64" height="36" fill="none" stroke="#FACC15" stroke-width="3"/>
  <text x="368" y="98" fill="#B45309" font-size="12" font-weight="bold">黄框 = 清单联动</text>
  <!-- 右：清单 -->
  <text x="450" y="28" fill="#0F172A" font-size="15" font-weight="bold">缺陷清单（点一行 → 图上黄框）</text>
  <g font-size="12.5">
    <rect x="450" y="44" width="300" height="26" fill="#EEF2F6"/>
    <text x="458" y="62" fill="#334155" font-weight="bold">#</text><text x="486" y="62" fill="#334155" font-weight="bold">面积</text><text x="556" y="62" fill="#334155" font-weight="bold">圆度</text><text x="636" y="62" fill="#334155" font-weight="bold">长宽比</text><text x="706" y="62" fill="#334155" font-weight="bold">位置</text>
    <rect x="450" y="74" width="300" height="24" fill="#fff"/><text x="458" y="91">1</text><text x="486" y="91">86.0</text><text x="556" y="91">0.92</text><text x="636" y="91">1.2</text><text x="706" y="91">180,180</text>
    <rect x="450" y="102" width="300" height="24" fill="#FEF9C3"/><text x="458" y="119" font-weight="bold">2</text><text x="486" y="119" font-weight="bold">45.5</text><text x="556" y="119" font-weight="bold">0.71</text><text x="636" y="119" font-weight="bold">2.6</text><text x="706" y="119" font-weight="bold">330,120</text>
    <rect x="450" y="130" width="300" height="24" fill="#fff"/><text x="458" y="147">3</text><text x="486" y="147">112.3</text><text x="556" y="147">0.28</text><text x="636" y="147">8.4</text><text x="706" y="147">420,260</text>
  </g>
  <text x="450" y="178" fill="#475569" font-size="12">8 个数组端口逐项对齐：清单第 i 行 = 图上第 i 个圈</text>
  <!-- 右下：要点 -->
  <g font-size="13">
    <text x="450" y="216" fill="#0F172A" font-weight="bold">三个要点：</text>
    <text x="450" y="240">· NG 也要发布 —— 恰恰是 NG 时最需要</text>
    <text x="466" y="260">立刻看到缺陷在哪（黑屏=跑机台前瞎猜）</text>
    <text x="450" y="284">· 编号 disp_text 用 "window" 坐标 + 白底框</text>
    <text x="450" y="308">· 编号最多画 300 个、清单 200 行，</text>
    <text x="466" y="328">端口与判定是全量不受影响</text>
  </g>
  <!-- 底注 -->
  <rect x="24" y="340" width="736" height="24" fill="#EFF6FF"/>
  <text x="34" y="357" fill="#1E40AF" font-size="12.5" font-weight="bold">离屏窗口按尺寸缓存复用（防 #9302 死锁）；dump_window_image 后立刻 Dispose 源对象（500 次约漏 160MB 的教训）</text>
</svg>
