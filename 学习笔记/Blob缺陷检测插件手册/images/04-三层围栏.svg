<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="430" fill="#FDFDFB"/>
  <!-- 图像框 -->
  <rect x="60" y="60" width="520" height="320" fill="#E7EAEE" stroke="#64748B" stroke-width="2"/>
  <!-- 边界带 ExcludeBorderPx -->
  <rect x="60" y="60" width="520" height="26" fill="#FDE68A" opacity="0.5"/>
  <rect x="60" y="354" width="520" height="26" fill="#FDE68A" opacity="0.5"/>
  <rect x="60" y="60" width="26" height="320" fill="#FDE68A" opacity="0.5"/>
  <rect x="554" y="60" width="26" height="320" fill="#FDE68A" opacity="0.5"/>
  <text x="240" y="78" fill="#92400E" font-size="12.5" font-weight="bold">ExcludeBorderPx 边界带（打光边缘效应）</text>
  <!-- MaskRegion -->
  <rect x="130" y="110" width="330" height="230" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="9 5"/>
  <text x="140" y="132" fill="#1D4ED8" font-size="13.5" font-weight="bold">MaskRegion 检测区（只在里面找）</text>
  <!-- ExcludeRegion：螺丝孔 -->
  <circle cx="300" cy="220" r="34" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="300" cy="220" r="34" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="258" y="266" fill="#B91C1C" font-size="12.5" font-weight="bold">ExcludeRegion：螺丝孔（固定干扰）</text>
  <!-- 缺陷们 -->
  <path d="M170,160 186,150 200,158 194,172 202,186 182,192 168,182 Z" fill="#334155"/>
  <ellipse cx="390" cy="160" rx="20" ry="8" fill="#334155" transform="rotate(-18 390 160)"/>
  <circle cx="420" cy="280" r="12" fill="#334155"/>
  <!-- 状态标注 -->
  <g font-size="12.5" font-weight="bold">
    <text x="150" y="216" fill="#15803D">✓ 检出</text>
    <text x="360" y="188" fill="#15803D">✓ 检出（划痕）</text>
    <text x="270" y="182" fill="#B91C1C">✗ 在排除区 → 丢弃</text>
    <text x="396" y="308" fill="#15803D">✓ 检出</text>
  </g>
  <!-- 边缘缺陷 -->
  <path d="M562,150 578,142 588,152 578,164 560,160 Z" fill="#334155"/>
  <text x="520" y="140" fill="#B91C1C" font-size="12.5" font-weight="bold">✗ 触边 → 丢弃</text>
  <!-- 右侧说明 -->
  <text x="600" y="110" fill="#0F172A" font-size="14" font-weight="bold">三层围栏</text>
  <text x="600" y="136" fill="#1D4ED8" font-size="12.5">① MaskRegion：只在这检</text>
  <text x="600" y="158" fill="#B91C1C" font-size="12.5">② ExcludeRegion：固定干扰</text>
  <text x="600" y="180" fill="#92400E" font-size="12.5">③ ExcludeBorderPx：边缘带</text>
  <text x="600" y="210" fill="#475569" font-size="12">Mask 语义 = reduce_domain，</text>
  <text x="600" y="228" font-size="12" fill="#475569">压边缺陷按裁剪后面积计；</text>
  <text x="600" y="246" fill="#475569" font-size="12">触边排除管不了画面中间的</text>
  <text x="600" y="264" fill="#475569" font-size="12">固定干扰 —— 那是 Exclude 的活</text>
  <text x="30" y="412" fill="#0F172A" font-size="14" font-weight="bold">三个误检源三把闸：整体范围（Mask）· 画面中间的固定干扰（Exclude）· 边缘效应（BorderPx）</text>
</svg>
