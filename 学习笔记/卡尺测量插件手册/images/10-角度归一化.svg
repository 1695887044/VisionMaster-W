<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#FDFDFB"/>
  <!-- 左：歧义 -->
  <text x="30" y="30" fill="#0F172A" font-size="15" font-weight="bold">angle_ll 的补角歧义：同一对线，两种报法</text>
  <!-- 顶点 -->
  <circle cx="160" cy="220" r="5" fill="#0F172A"/>
  <text x="120" y="248" fill="#475569" font-size="13">两线交点</text>
  <!-- 线1：水平向右 -->
  <line x1="160" y1="220" x2="360" y2="220" stroke="#2563EB" stroke-width="3"/>
  <text x="330" y="212" fill="#1D4ED8" font-size="13">线1</text>
  <!-- 线2：150°（左上方向，屏幕角度 -150） -->
  <line x1="160" y1="220" x2="40" y2="145" stroke="#2563EB" stroke-width="3"/>
  <text x="46" y="132" fill="#1D4ED8" font-size="13">线2</text>
  <!-- 150° 弧（从线1逆时针到线2，经过下方？不：150° 内角在上方左侧） -->
  <path d="M 230 220 A 70 70 0 0 0 99.4 185" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <text x="222" y="180" fill="#15803D" font-size="14" font-weight="bold">真值 150°（钝角）</text>
  <!-- 30° 补角 -->
  <line x1="160" y1="220" x2="60" y2="300" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 120 220 A 40 40 0 0 1 125.4 240" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="60" y="286" fill="#DC2626" font-size="13" font-weight="bold">补角 30°</text>
  <text x="40" y="326" fill="#B91C1C" font-size="13" font-weight="bold">直接对 fit 输出求角：方向向量取向一变，</text>
  <text x="40" y="346" fill="#B91C1C" font-size="13" font-weight="bold">150° 可能报成 −30°——现场看就是「角度全错」</text>
  <!-- 右：归一化 -->
  <text x="430" y="30" fill="#0F172A" font-size="15" font-weight="bold">修法：先归一化「交点 → 远端」射线</text>
  <!-- 归一化后的两条射线 -->
  <circle cx="530" cy="220" r="5" fill="#0F172A"/>
  <line x1="530" y1="220" x2="700" y2="220" stroke="#2563EB" stroke-width="3"/>
  <line x1="530" y1="220" x2="410" y2="145" stroke="#2563EB" stroke-width="3"/>
  <path d="M 600 220 A 70 70 0 0 0 469.4 185" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <text x="592" y="180" fill="#15803D" font-size="14" font-weight="bold">恒定 150°</text>
  <!-- 归一化说明 -->
  <rect x="410" y="250" width="330" height="56" rx="4" fill="#F0F7FF" stroke="#93C5FD"/>
  <text x="422" y="272" fill="#1E40AF" font-size="12.5" font-weight="bold">归一化：把每条线的方向向量统一成</text>
  <text x="422" y="292" fill="#1E40AF" font-size="12.5" font-weight="bold">「从交点指向点分布远端」，再 angle_ll</text>
  <!-- 底注 -->
  <text x="30" y="378" fill="#0F172A" font-size="13.5" font-weight="bold">实测背书：30° / 90° / 150° → 29.91° / 90° / 150.1°（0~180° 归一化正确，没有报成 −30）</text>
  <text x="30" y="396" fill="#475569" font-size="12.5">另：angle_ll 返回弧度，代码 ×180/π；角度不受像素当量影响（量纲无关量）</text>
</svg>
