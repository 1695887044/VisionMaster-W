<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="480" fill="#FDFDFB"/>
  <defs>
    <marker id="cR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <!-- 上：错误排布 -->
  <text x="30" y="28" fill="#B91C1C" font-size="15" font-weight="bold">✗ 第一批：排布向量写成 (cosφ, −sinφ)</text>
  <!-- 搜索矩形（φ=30°，中心 300,190，L1=120 L2=60） -->
  <g transform="rotate(-30 300 190)">
    <rect x="180" y="130" width="240" height="120" fill="#F1F5F9" stroke="#2563EB" stroke-width="2"/>
  </g>
  <!-- 长轴虚线 -->
  <line x1="212" y1="120" x2="388" y2="264" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- 错误排布的 5 把卡尺：中心 = c + t·(0.866,−0.5)，t=-48..48 -->
  <g fill="none" stroke="#DC2626" stroke-width="2">
    <rect x="218" y="204" width="80" height="12" transform="rotate(-30 258 210)"/>
    <rect x="239" y="192" width="80" height="12" transform="rotate(-30 279 198)"/>
    <rect x="260" y="180" width="80" height="12" transform="rotate(-30 300 186)"/>
    <rect x="281" y="168" width="80" height="12" transform="rotate(-30 321 174)"/>
    <rect x="302" y="156" width="80" height="12" transform="rotate(-30 342 162)"/>
  </g>
  <!-- 漂移箭头 -->
  <line x1="300" y1="200" x2="262" y2="222" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#cR)"/>
  <line x1="300" y1="200" x2="338" y2="178" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#cR)"/>
  <text x="404" y="120" fill="#B91C1C" font-size="13" font-weight="bold">排布方向与长轴夹 150° ≠ 90°</text>
  <text x="404" y="140" fill="#B91C1C" font-size="13">越往外越歪：外侧卡尺漂出搜索区</text>
  <text x="404" y="160" fill="#475569" font-size="12.5">φ=0 时两个向量重合 → 完全看不出错</text>
  <text x="404" y="178" fill="#475569" font-size="12.5">第一批实测全在 φ=0 —— 事故被完美隐藏</text>
  <!-- 下：正确排布 -->
  <text x="30" y="258" fill="#15803D" font-size="15" font-weight="bold">✓ 修正后：排布向量 (cosφ, +sinφ)</text>
  <g transform="rotate(-30 300 380)">
    <rect x="180" y="320" width="240" height="120" fill="#F1F5F9" stroke="#2563EB" stroke-width="2"/>
  </g>
  <line x1="212" y1="310" x2="388" y2="454" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g fill="none" stroke="#16A34A" stroke-width="2">
    <rect x="218" y="294" width="80" height="12" transform="rotate(-30 258 300)"/>
    <rect x="239" y="306" width="80" height="12" transform="rotate(-30 279 312)"/>
    <rect x="260" y="318" width="80" height="12" transform="rotate(-30 300 324)"/>
    <rect x="281" y="330" width="80" height="12" transform="rotate(-30 321 336)"/>
    <rect x="302" y="342" width="80" height="12" transform="rotate(-30 342 348)"/>
  </g>
  <text x="404" y="330" fill="#15803D" font-size="13" font-weight="bold">排布方向 ⟂ 扫描方向 ✓</text>
  <text x="404" y="350" fill="#475569" font-size="12.5">5 把卡尺均匀铺满整段 L2，</text>
  <text x="404" y="368" fill="#475569" font-size="12.5">每把保留完整 L1 扫描长度</text>
  <!-- 底注 -->
  <rect x="20" y="436" width="740" height="36" rx="4" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="32" y="450" fill="#B91C1C" font-size="12.5" font-weight="bold">验证方法论（比 bug 本身更值钱）：几何约定不能靠推理 —— 写「非对称位置探针」实测裁决，</text>
  <text x="32" y="466" fill="#B91C1C" font-size="12.5" font-weight="bold">且探针必须覆盖 φ≠0 的位置；第一批实测全在 φ=0，事故被完美隐藏（见手册 4.6 节）</text>
</svg>
