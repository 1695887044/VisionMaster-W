<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="800" height="330" fill="#FDFDFB"/>
  <!-- 1 宽度 -->
  <rect x="20" y="40" width="130" height="190" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="55" y="60" width="60" height="150" fill="none" stroke="#D97706" stroke-width="2"/>
  <rect x="70" y="70" width="30" height="130" fill="#E6E6E6"/>
  <line x1="85" y1="70" x2="85" y2="200" stroke="#16A34A" stroke-width="2.5"/>
  <text x="30" y="258" fill="#0F172A" font-size="14" font-weight="bold">宽度/间隙</text>
  <text x="24" y="278" fill="#64748B" font-size="12">1 矩形 · measure_pairs</text>
  <!-- 2 两点距 -->
  <rect x="180" y="40" width="130" height="190" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="196" y="70" width="34" height="50" fill="none" stroke="#D97706" stroke-width="2"/>
  <rect x="262" y="150" width="34" height="50" fill="none" stroke="#D97706" stroke-width="2"/>
  <circle cx="213" cy="95" r="4" fill="#16A34A"/><circle cx="279" cy="175" r="4" fill="#16A34A"/>
  <line x1="213" y1="95" x2="279" y2="175" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="190" y="258" fill="#0F172A" font-size="14" font-weight="bold">两点距</text>
  <text x="184" y="278" fill="#64748B" font-size="12">2 矩形 · distance_pp</text>
  <!-- 3 点到线距 -->
  <rect x="340" y="40" width="130" height="190" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="352" y1="200" x2="458" y2="160" stroke="#D2691E" stroke-width="2.5"/>
  <circle cx="392" cy="86" r="4" fill="#16A34A"/>
  <line x1="392" y1="86" x2="410" y2="176" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="350" y="258" fill="#0F172A" font-size="14" font-weight="bold">点到线距</text>
  <text x="344" y="278" fill="#64748B" font-size="12">2 矩形 · fit_line + distance_pl</text>
  <!-- 4 圆直径 -->
  <rect x="500" y="40" width="130" height="190" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="565" cy="130" r="52" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <circle cx="565" cy="130" r="52" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g stroke="#D97706" stroke-width="1.5">
    <line x1="565" y1="70" x2="565" y2="50"/><line x1="565" y1="190" x2="565" y2="210"/>
    <line x1="505" y1="130" x2="485" y2="130"/><line x1="625" y1="130" x2="645" y2="130"/>
  </g>
  <text x="510" y="258" fill="#0F172A" font-size="14" font-weight="bold">圆直径</text>
  <text x="500" y="278" fill="#64748B" font-size="12">1 圆 · 径向卡尺 + fit_circle</text>
  <!-- 5 角度 -->
  <rect x="660" y="40" width="130" height="190" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="675" y1="210" x2="745" y2="90" stroke="#D2691E" stroke-width="2.5"/>
  <line x1="675" y1="210" x2="780" y2="170" stroke="#D2691E" stroke-width="2.5"/>
  <path d="M 723 158 A 60 60 0 0 0 700 152" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <text x="670" y="258" fill="#0F172A" font-size="14" font-weight="bold">角度</text>
  <text x="662" y="278" fill="#64748B" font-size="12">2 矩形 · fit×2 + angle_ll</text>
  <!-- 底注 -->
  <text x="20" y="312" fill="#475569" font-size="14">绿色 = 测量结果 · 琥珀 = 搜索区/卡尺 · 青虚线 = 测量连线 · 角度输出恒为「度」，不受像素当量影响</text>
</svg>
