<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="400" fill="#FDFDFB"/>
  <!-- 左：学习 -->
  <text x="30" y="30" fill="#0F172A" font-size="16" font-weight="bold">学习：把照片描成「线稿」</text>
  <rect x="30" y="50" width="310" height="270" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <!-- 模板区域框 -->
  <rect x="70" y="80" width="230" height="200" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="76" y="98" fill="#1D4ED8" font-size="13">框住纹理丰富的区域</text>
  <!-- 零件形状（灰）+ 绿色特征轮廓 -->
  <polygon points="110,130 250,130 250,190 190,190 190,240 110,240"
           fill="#D8DEE6" stroke="#8A97A6" stroke-width="2"/>
  <polygon points="110,130 250,130 250,190 190,190 190,240 110,240"
           fill="none" stroke="#16A34A" stroke-width="3"/>
  <circle cx="220" cy="160" r="16" fill="#C2CAD4" stroke="#16A34A" stroke-width="2.5"/>
  <text x="40" y="345" fill="#475569" font-size="13.5">绿线 = 记住的特征：哪里有明暗边界、边界朝哪个方向</text>
  <!-- 右：查找 -->
  <text x="450" y="30" fill="#0F172A" font-size="16" font-weight="bold">查找：在场景里找同样的特征组合</text>
  <rect x="450" y="50" width="310" height="270" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <g transform="translate(500,110) rotate(25)">
    <polygon points="0,0 140,0 140,60 70,60 70,110 0,110"
             fill="#D8DEE6" stroke="#16A34A" stroke-width="3"/>
    <circle cx="110" cy="30" r="16" fill="#C2CAD4" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <circle cx="640" cy="205" r="5" fill="#DC2626"/>
  <text x="652" y="200" fill="#DC2626" font-size="14" font-weight="bold">Row, Column（亚像素）</text>
  <text x="652" y="220" fill="#DC2626" font-size="14">Angle = 25°（度）</text>
  <text x="652" y="240" fill="#DC2626" font-size="14">Score = 0.95</text>
  <text x="460" y="345" fill="#475569" font-size="13.5">转了 25°、位置飘了——线稿能对上，就是同一个东西</text>
  <!-- 底部结论 -->
  <text x="30" y="385" fill="#0F172A" font-size="15" font-weight="bold">光照变亮：像素全变了，线稿没变 → 照样找到。比「形状」，不是比「像素」。</text>
</svg>
