<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="340" fill="#FDFDFB"/>
  <!-- 左：命中时（歪的） -->
  <text x="30" y="30" fill="#0F172A" font-size="15" font-weight="bold">命中时：产品歪 20°、位置飘了</text>
  <rect x="30" y="50" width="300" height="220" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <g transform="translate(110,100) rotate(20)">
    <polygon points="0,0 140,0 140,60 70,60 70,110 0,110"
             fill="#D8DEE6" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <rect x="150" y="130" width="90" height="60" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="298" fill="#64748B" font-size="13">下游的固定坐标框（蓝）已经套不住产品了</text>
  <!-- 中间箭头 -->
  <line x1="345" y1="160" x2="425" y2="160" stroke="#2563EB" stroke-width="3"/>
  <polygon points="425,160 411,153 411,167" fill="#2563EB"/>
  <text x="322" y="142" fill="#1D4ED8" font-size="12.5" font-weight="bold">vector_angle_to_rigid</text>
  <text x="322" y="185" fill="#1D4ED8" font-size="12.5">affine_trans_image</text>
  <text x="322" y="203" fill="#1D4ED8" font-size="11.5">('constant','false')</text>
  <!-- 右：AlignedImage -->
  <text x="440" y="30" fill="#0F172A" font-size="15" font-weight="bold">AlignedImage：掰回标准位姿</text>
  <rect x="440" y="50" width="300" height="220" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <!-- 出界填黑：上边缘与左边缘的黑色条带 -->
  <rect x="440" y="50" width="300" height="24" fill="#0F172A"/>
  <rect x="440" y="50" width="24" height="220" fill="#0F172A"/>
  <!-- 产品（正的，标准位姿） -->
  <g transform="translate(545,120) rotate(0)">
    <polygon points="0,0 140,0 140,60 70,60 70,110 0,110"
             fill="#D8DEE6" stroke="#16A34A" stroke-width="2.5"/>
  </g>
  <rect x="530" y="110" width="90" height="60" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="536" y="298" fill="#15803D" font-size="13" font-weight="bold">蓝框稳稳套住 —— 固定坐标工具零改动</text>
  <!-- 底注 -->
  <text x="30" y="322" fill="#0F172A" font-size="14" font-weight="bold">把「产品在哪」压缩成「产品永远在原点」；画幅不变 → 原画面边缘出界填黑，黑边是正常现象</text>
</svg>
