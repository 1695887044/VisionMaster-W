<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="430" fill="#FDFDFB"/>
  <defs>
    <marker id="pAr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>
  <!-- 上：区域用 T -->
  <text x="30" y="28" fill="#0F172A" font-size="15" font-weight="bold">① 区域用 T（模板系 → 当前系）：BaseRegion 在模板坐标系里</text>
  <!-- 模板图 -->
  <rect x="30" y="46" width="220" height="150" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="40" y="66" fill="#475569" font-size="12">模板图（学习时）</text>
  <rect x="90" y="90" width="110" height="70" fill="none" stroke="#16A34A" stroke-width="3"/>
  <text x="96" y="180" fill="#15803D" font-size="12.5" font-weight="bold">基准 ROI（绿）</text>
  <text x="40" y="216" fill="#64748B" font-size="11.5">位姿 = 参考点、角度 0</text>
  <!-- T 箭头 -->
  <line x1="256" y1="120" x2="306" y2="120" stroke="#B45309" stroke-width="3" marker-end="url(#pAr)"/>
  <text x="258" y="106" fill="#B45309" font-size="14" font-weight="bold">T</text>
  <!-- 当前图 -->
  <rect x="310" y="46" width="220" height="150" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="320" y="66" fill="#475569" font-size="12">当前图（转了 25°、飘了）</text>
  <g transform="translate(390,120) rotate(25)">
    <rect x="0" y="0" width="110" height="70" fill="#D8DEE6" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="14" y="16" width="110" height="70" fill="none" stroke="#F59E0B" stroke-width="3" transform="translate(-14,-16)"/>
  </g>
  <text x="318" y="216" fill="#E2880B" font-size="12.5" font-weight="bold">跟随 ROI（橙）跟着产品走 ✓</text>
  <!-- 下：图像用 T⁻¹ -->
  <text x="30" y="266" fill="#0F172A" font-size="15" font-weight="bold">② 图像用 T⁻¹（当前系 → 模板系）：对齐回参考位姿</text>
  <rect x="30" y="284" width="220" height="120" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="40" y="304" fill="#475569" font-size="12">当前图：亮点在 (100,50)</text>
  <circle cx="140" cy="330" r="7" fill="#DC2626"/>
  <line x1="254" y1="344" x2="304" y2="344" stroke="#B45309" stroke-width="3" marker-end="url(#pAr)"/>
  <text x="256" y="330" fill="#B45309" font-size="14" font-weight="bold">T⁻¹</text>
  <rect x="308" y="284" width="220" height="120" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <circle cx="370" cy="330" r="7" fill="#16A34A"/>
  <text x="384" y="336" fill="#15803D" font-size="12.5" font-weight="bold">亮点回到参考点 (60,60) ✓</text>
  <!-- 右侧警示 -->
  <rect x="560" y="284" width="200" height="120" rx="4" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="572" y="308" fill="#B91C1C" font-size="12.5" font-weight="bold">写反的后果：</text>
  <text x="572" y="328" fill="#B91C1C" font-size="12">对图也用 T → 内容被推离</text>
  <text x="572" y="346" fill="#B91C1C" font-size="12">参考位姿【两倍偏差】</text>
  <text x="572" y="364" fill="#475569" font-size="11.5">（会到 (140,40) 而不是 (60,60)）</text>
  <text x="572" y="388" fill="#475569" font-size="11.5">断言锁死：合成图回归</text>
</svg>
