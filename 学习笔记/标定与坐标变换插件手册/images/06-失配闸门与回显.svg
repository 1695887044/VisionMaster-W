<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="430" fill="#FDFDFB"/>
  <defs>
    <marker id="gAr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <text x="30" y="30" fill="#0F172A" font-size="15" font-weight="bold">像素 → 机械：换算前连闯四道闸，任何一道不过 = 明确失败（绝不静默变换）</text>
  <!-- 输入 -->
  <rect x="20" y="150" width="96" height="56" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="32" y="174" fill="#0F172A" font-size="12.5" font-weight="bold">像素点输入</text>
  <text x="32" y="192" fill="#475569" font-size="11.5">Row / Col（+角度）</text>
  <!-- 闸1 -->
  <rect x="136" y="140" width="120" height="76" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="146" y="164" fill="#9A3412" font-size="12.5" font-weight="bold">闸① 标定可用？</text>
  <text x="146" y="182" fill="#78350F" font-size="11">未接 / PixelScale 冒充 /</text>
  <text x="146" y="198" fill="#78350F" font-size="11">矩阵损坏 → 失败</text>
  <!-- 闸2 -->
  <rect x="276" y="140" width="120" height="76" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="286" y="164" fill="#9A3412" font-size="12.5" font-weight="bold">闸② 相机身份</text>
  <text x="286" y="182" fill="#78350F" font-size="11">两端序列号都非空</text>
  <text x="286" y="198" fill="#78350F" font-size="11">且不符 → 失败</text>
  <!-- 闸3 -->
  <rect x="416" y="140" width="120" height="76" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="426" y="164" fill="#9A3412" font-size="12.5" font-weight="bold">闸③ 图像尺寸</text>
  <text x="426" y="182" fill="#78350F" font-size="11">标定 2448×2048 vs</text>
  <text x="426" y="198" fill="#78350F" font-size="11">当前 1280×1024 → 失败</text>
  <!-- 闸4 -->
  <rect x="556" y="140" width="120" height="76" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="566" y="164" fill="#9A3412" font-size="12.5" font-weight="bold">闸④ 像素点有效</text>
  <text x="566" y="182" fill="#78350F" font-size="11">(0,0) / NaN → 失败</text>
  <text x="566" y="198" fill="#78350F" font-size="11">（多半匹配失败了）</text>
  <!-- 流程箭头 -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#gAr)">
    <line x1="116" y1="178" x2="132" y2="178"/>
    <line x1="256" y1="178" x2="272" y2="178"/>
    <line x1="396" y1="178" x2="412" y2="178"/>
    <line x1="536" y1="178" x2="552" y2="178"/>
  </g>
  <!-- 变换 -->
  <rect x="696" y="140" width="66" height="76" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="706" y="172" fill="#1E40AF" font-size="12" font-weight="bold">正变换</text>
  <text x="700" y="190" fill="#475569" font-size="10.5">九点/透视/网格</text>
  <line x1="676" y1="178" x2="692" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#gAr)"/>
  <!-- 回显环 -->
  <path d="M 729 216 C 729 300 420 320 120 240" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#gAr)"/>
  <rect x="240" y="272" width="360" height="40" rx="4" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="252" y="290" fill="#065F46" font-size="12.5" font-weight="bold">回显自校验：机械坐标反算回像素，与输入比</text>
  <text x="252" y="306" fill="#065F46" font-size="12">偏差 &gt; 1e-6px 即失败 —— 矩阵损坏当场露馅</text>
  <!-- 失败出口 -->
  <g font-size="11.5" fill="#B91C1C">
    <text x="136" y="128">未接标定…</text>
    <text x="282" y="128">相机身份不符…</text>
    <text x="422" y="128">尺寸不符…</text>
    <text x="562" y="128">位姿/点无效…</text>
  </g>
  <!-- 底注 -->
  <text x="30" y="374" fill="#0F172A" font-size="13.5" font-weight="bold">设计立场：「看着正常」的错变换，比失败可怕一百倍 —— 失配必须明确失败，且文案带「下一步」</text>
  <text x="30" y="398" fill="#475569" font-size="12.5">失败时输出端口保持开轮清零值（下游读不到上一轮残留）；幂等：同一输入永远同一输出</text>
</svg>
