<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="440" fill="#FDFDFB"/>
  <!-- 坐标轴 -->
  <line x1="70" y1="340" x2="740" y2="340" stroke="#94A3B8" stroke-width="2"/>
  <line x1="70" y1="340" x2="70" y2="55" stroke="#94A3B8" stroke-width="2"/>
  <text x="640" y="362" fill="#475569" font-size="13">剖面位置（沿短轴扫过）</text>
  <text x="20" y="70" fill="#475569" font-size="13">亮度 V</text>
  <!-- 参考线 -->
  <line x1="70" y1="82" x2="740" y2="82" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="74" y="76" fill="#64748B" font-size="12.5">众数亮度 ≈235（缝/背景的水平）</text>
  <line x1="70" y1="318" x2="740" y2="318" stroke="#94A3B8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="74" y="333" fill="#64748B" font-size="12.5">2 号百分位 ≈50（最暗线像素，不用最小值防坏点）</text>
  <!-- 可靠段底衬（暗/彩） -->
  <g fill="#DCFCE7" opacity="0.55">
    <rect x="96"  y="60" width="44" height="280"/>
    <rect x="220" y="60" width="44" height="280"/>
    <rect x="282" y="60" width="44" height="280"/>
    <rect x="344" y="60" width="44" height="280"/>
    <rect x="406" y="60" width="44" height="280"/>
    <rect x="530" y="60" width="44" height="280"/>
    <rect x="592" y="60" width="44" height="280"/>
    <rect x="654" y="60" width="44" height="280"/>
  </g>
  <!-- 亮度曲线：暗线凹陷，白线（552）无凹陷 -->
  <polyline points="70,82 96,84 118,274 140,84 166,82 198,86 220,278 242,84 264,82 282,230 304,170 326,226 344,86 366,236 388,88 406,142 428,90 450,86 472,82 494,84 516,80 538,78 552,76 566,78 588,82 610,238 632,90 654,250 676,88 700,82 740,82"
            fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <!-- 彩度虚线（彩色线的第二个证据） -->
  <polyline points="282,320 304,290 326,320 344,322 366,296 388,322 406,308 428,320 450,322 470,320 530,320 552,318 574,320 610,298 632,320 654,300 676,320 740,320"
            fill="none" stroke="#F2994A" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="470" y="300" fill="#E2880B" font-size="12.5" font-weight="bold">彩度（虚线）：彩色线的第二个证据</text>
  <!-- 白线标注 -->
  <rect x="516" y="60" width="72" height="280" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="48" fill="#DC2626" font-size="13.5" font-weight="bold">白线：V≈240 与背景 235 只差 5 个灰阶 —— 亮度上抓不到！</text>
  <!-- 暗线阈值 -->
  <line x1="70" y1="153" x2="740" y2="153" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="84" y="148" fill="#DC2626" font-size="13" font-weight="bold">暗线阈值 = 众数 − 35% ×（众数 − 2%分位）→ 自适应，换灯不用重调</text>
  <!-- 底注 -->
  <text x="70" y="392" fill="#0F172A" font-size="14" font-weight="bold">可靠像素三类：暗（V&lt;暗线阈值）· 彩（彩度&gt;大津阈值，虚线冒泡）· 极亮（V&gt;白线百分位）</text>
  <text x="70" y="416" fill="#475569" font-size="13">绿衬 = 可靠段；由它们的间距估线距 → 等间距铺满 → 白线被「补」出来（下一张图）</text>
</svg>
