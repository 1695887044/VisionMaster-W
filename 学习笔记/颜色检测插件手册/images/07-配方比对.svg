<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="360" fill="#FDFDFB"/>
  <!-- 期望 -->
  <text x="30" y="36" fill="#0F172A" font-size="15" font-weight="bold">配方：10 芯 = 黑,白,灰,紫,蓝,绿,黄,红,玫红,棕</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60"  y="52" width="56" height="34" fill="#212121"/><text x="88"  y="74" fill="#fff">黑</text>
    <rect x="120" y="52" width="56" height="34" fill="#FAFAFA" stroke="#CBD5E1"/><text x="148" y="74" fill="#334155">白</text>
    <rect x="180" y="52" width="56" height="34" fill="#9E9E9E"/><text x="208" y="74" fill="#fff">灰</text>
    <rect x="240" y="52" width="56" height="34" fill="#8E24AA"/><text x="268" y="74" fill="#fff">紫</text>
    <rect x="300" y="52" width="56" height="34" fill="#1E88E5"/><text x="328" y="74" fill="#fff">蓝</text>
    <rect x="360" y="52" width="56" height="34" fill="#43A047"/><text x="388" y="74" fill="#fff">绿</text>
    <rect x="420" y="52" width="56" height="34" fill="#FDD835"/><text x="448" y="74" fill="#333">黄</text>
    <rect x="480" y="52" width="56" height="34" fill="#E53935"/><text x="508" y="74" fill="#fff">红</text>
    <rect x="540" y="52" width="56" height="34" fill="#EC407A"/><text x="568" y="74" fill="#fff">玫红</text>
    <rect x="600" y="52" width="56" height="34" fill="#795548"/><text x="628" y="74" fill="#fff">棕</text>
  </g>
  <g fill="#64748B" font-size="11.5" text-anchor="middle">
    <text x="88" y="102">1</text><text x="148" y="102">2</text><text x="208" y="102">3</text><text x="268" y="102">4</text>
    <text x="328" y="102">5</text><text x="388" y="102">6</text><text x="448" y="102">7</text><text x="508" y="102">8</text>
    <text x="568" y="102">9</text><text x="628" y="102">10</text>
  </g>
  <!-- 实测 -->
  <text x="30" y="150" fill="#0F172A" font-size="15" font-weight="bold">实测序列：第 3 根是「白」（装错/褪色）</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60"  y="166" width="56" height="34" fill="#212121"/><text x="88"  y="188" fill="#fff">黑</text>
    <rect x="120" y="166" width="56" height="34" fill="#FAFAFA" stroke="#CBD5E1"/><text x="148" y="188" fill="#334155">白</text>
    <rect x="180" y="166" width="56" height="34" fill="#FAFAFA" stroke="#DC2626" stroke-width="3"/><text x="208" y="188" fill="#B91C1C">白!</text>
    <rect x="240" y="166" width="56" height="34" fill="#8E24AA"/><text x="268" y="188" fill="#fff">紫</text>
    <rect x="300" y="166" width="56" height="34" fill="#1E88E5"/><text x="328" y="188" fill="#fff">蓝</text>
    <rect x="360" y="166" width="56" height="34" fill="#43A047"/><text x="388" y="188" fill="#fff">绿</text>
    <rect x="420" y="166" width="56" height="34" fill="#FDD835"/><text x="448" y="188" fill="#333">黄</text>
    <rect x="480" y="166" width="56" height="34" fill="#E53935"/><text x="508" y="188" fill="#fff">红</text>
    <rect x="540" y="166" width="56" height="34" fill="#EC407A"/><text x="568" y="188" fill="#fff">玫红</text>
    <rect x="600" y="166" width="56" height="34" fill="#795548"/><text x="628" y="188" fill="#fff">棕</text>
  </g>
  <rect x="176" y="162" width="64" height="42" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="30" y="234" fill="#B91C1C" font-size="15" font-weight="bold">Result = false ， BadIndex = 3（第 3 位不符：应为 灰、实测 白）</text>
  <!-- 三条铁律 -->
  <g font-size="13.5">
    <rect x="30" y="256" width="720" height="26" fill="#F1F5F9"/>
    <text x="40" y="274" fill="#334155">· 根数不符 → BadIndex = 0（长度对不上，无从谈「第几位」）</text>
    <rect x="30" y="288" width="720" height="26" fill="#FEF2F2"/>
    <text x="40" y="306" fill="#B91C1C" font-weight="bold">· 配方缺失 → 报错停流程，不判 NG（工程配置问题 ≠ 产品不良）</text>
    <rect x="30" y="320" width="720" height="26" fill="#F1F5F9"/>
    <text x="40" y="338" fill="#334155">· ExpectedSequence 端口有值 → 端口优先，不查配方表（配方可从 MES/工单下发）；某位写 * = 该位不检</text>
  </g>
</svg>
