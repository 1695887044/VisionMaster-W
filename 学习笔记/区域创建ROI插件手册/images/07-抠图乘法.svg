<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="840" height="400" fill="#FDFDFB"/>
  <defs>
    <clipPath id="m3"><circle cx="670" cy="180" r="85"/></clipPath>
  </defs>
  <!-- ① 原图 -->
  <rect x="20" y="70" width="220" height="220" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <rect x="35" y="90" width="80" height="60" fill="#CBD5E1"/>
  <rect x="130" y="110" width="90" height="70" fill="#94A3B8"/>
  <rect x="40" y="210" width="100" height="60" fill="#BCC7D4"/>
  <rect x="150" y="230" width="70" height="50" fill="#CBD5E1"/>
  <circle cx="130" cy="180" r="85" fill="none" stroke="#D97706" stroke-width="3"/>
  <text x="105" y="185" fill="#B45309" font-size="16" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">182</text>
  <text x="196" y="116" fill="#334155" font-size="16" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">90</text>
  <text x="20" y="316" fill="#0F172A" font-size="14" font-weight="bold">① 原图（圈内 182 / 圈外 90）</text>
  <text x="252" y="192" fill="#0F172A" font-size="34" font-weight="bold">×</text>
  <!-- ② 掩膜 -->
  <rect x="290" y="70" width="220" height="220" fill="#0F172A"/>
  <circle cx="400" cy="180" r="85" fill="#FFFFFF"/>
  <text x="378" y="186" fill="#0F172A" font-size="16" font-weight="bold">255</text>
  <text x="462" y="112" fill="#94A3B8" font-size="16" font-weight="bold">0</text>
  <text x="290" y="316" fill="#0F172A" font-size="14" font-weight="bold">② 掩膜（圈内 255 / 圈外 0）</text>
  <text x="522" y="192" fill="#0F172A" font-size="34" font-weight="bold">=</text>
  <!-- ③ 结果 -->
  <rect x="560" y="70" width="220" height="220" fill="#0F172A"/>
  <g clip-path="url(#m3)">
    <rect x="575" y="90" width="80" height="60" fill="#CBD5E1"/>
    <rect x="670" y="110" width="90" height="70" fill="#94A3B8"/>
    <rect x="580" y="210" width="100" height="60" fill="#BCC7D4"/>
    <rect x="690" y="230" width="70" height="50" fill="#CBD5E1"/>
  </g>
  <text x="645" y="185" fill="#B45309" font-size="16" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">182</text>
  <text x="560" y="316" fill="#0F172A" font-size="14" font-weight="bold">③ 结果（圈内保留 / 圈外变黑）</text>
  <!-- 警告条 -->
  <rect x="20" y="345" width="800" height="34" rx="4" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="32" y="367" fill="#B91C1C" font-size="13.5" font-weight="bold">⚠ mult_image 缩放因子必须一步写 1.0/255.0 —— 拆成「÷255 再乘」两步整数运算，128→0 截断，半透明区全黑；彩色图先 compose3 把掩膜复制 3 份</text>
</svg>
