<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="400" fill="#FDFDFB"/>
  <!-- 网格：10列×8行，格34px -->
  <g fill="#F59E0B" fill-opacity="0.35">
    <rect x="152" y="94" width="136" height="34"/>
    <rect x="118" y="128" width="204" height="34"/>
    <rect x="118" y="162" width="204" height="34"/>
    <rect x="152" y="196" width="136" height="34"/>
  </g>
  <g stroke="#CBD5E1" stroke-width="1">
    <line x1="50" y1="60" x2="50" y2="332"/><line x1="84" y1="60" x2="84" y2="332"/><line x1="118" y1="60" x2="118" y2="332"/><line x1="152" y1="60" x2="152" y2="332"/><line x1="186" y1="60" x2="186" y2="332"/><line x1="220" y1="60" x2="220" y2="332"/><line x1="254" y1="60" x2="254" y2="332"/><line x1="288" y1="60" x2="288" y2="332"/><line x1="322" y1="60" x2="322" y2="332"/><line x1="356" y1="60" x2="356" y2="332"/><line x1="390" y1="60" x2="390" y2="332"/>
    <line x1="50" y1="60" x2="390" y2="60"/><line x1="50" y1="94" x2="390" y2="94"/><line x1="50" y1="128" x2="390" y2="128"/><line x1="50" y1="162" x2="390" y2="162"/><line x1="50" y1="196" x2="390" y2="196"/><line x1="50" y1="230" x2="390" y2="230"/><line x1="50" y1="264" x2="390" y2="264"/><line x1="50" y1="298" x2="390" y2="298"/><line x1="50" y1="332" x2="390" y2="332"/>
  </g>
  <g fill="#64748B" font-size="12" text-anchor="end">
    <text x="44" y="82">行1</text><text x="44" y="116">行2</text><text x="44" y="150">行3</text><text x="44" y="184">行4</text><text x="44" y="218">行5</text><text x="44" y="252">行6</text><text x="44" y="286">行7</text><text x="44" y="320">行8</text>
  </g>
  <g fill="#64748B" font-size="12" text-anchor="middle">
    <text x="67" y="52">列1</text><text x="101" y="52">列2</text><text x="135" y="52">列3</text><text x="169" y="52">列4</text><text x="203" y="52">列5</text><text x="237" y="52">列6</text><text x="271" y="52">列7</text><text x="305" y="52">列8</text><text x="339" y="52">列9</text><text x="373" y="52">列10</text>
  </g>
  <line x1="118" y1="145" x2="402" y2="150" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="408" y="154" fill="#DC2626" font-size="14" font-weight="bold">第3行：列3~8 被选中 → 记作「3,3,8」</text>
  <!-- 右侧文本 -->
  <text x="410" y="62" fill="#0F172A" font-size="16" font-weight="bold">get_region_runs → 每行只记 3 个数</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#334155">
    <text x="430" y="92">行,起列,止列</text>
    <text x="430" y="118">2,4,7</text>
    <text x="430" y="144">3,3,8</text>
    <text x="430" y="170">4,3,8</text>
    <text x="430" y="196">5,4,7</text>
  </g>
  <text x="410" y="248" fill="#475569" font-size="14">无损 · 可读 · 天然适合存文件</text>
  <text x="410" y="274" fill="#475569" font-size="14">超 4KB → 「gz:」前缀 + base64（两代格式互认）</text>
  <text x="410" y="300" fill="#B91C1C" font-size="14" font-weight="bold">⚠ 行号是真实像素行（1 基）</text>
  <text x="50" y="372" fill="#475569" font-size="14">涂抹 / 擦除区域就是这样随方案保存的（源码 RegionToData :749-797）</text>
</svg>
