<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="700" height="510" fill="#FDFDFB"/>
  <defs>
    <marker id="arR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="680" height="440" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="10" cy="10" r="4" fill="#DC2626"/>
  <text x="20" y="36" fill="#DC2626" font-size="14">原图 (0,0)</text>
  <!-- 轴平行外接矩形 -->
  <rect x="178.8" y="178" width="302.4" height="234" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="196" y="168" fill="#1D4ED8" font-size="15" font-weight="bold">smallest_rectangle1 → 轴平行外接矩形</text>
  <!-- 旋转 ROI -->
  <polygon points="481.2,282 421.2,178 178.8,318 238.8,412" fill="#F59E0B" fill-opacity="0.32" stroke="#D97706" stroke-width="2.5"/>
  <text x="300" y="300" fill="#B45309" font-size="14">ROI（可旋转）</text>
  <!-- 裁剪原点 -->
  <line x1="20" y1="20" x2="172" y2="172" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arR2)"/>
  <text x="34" y="112" fill="#DC2626" font-size="14" font-weight="bold">Offset = (Row1, Col1)</text>
  <circle cx="178.8" cy="178" r="6" fill="#DC2626"/>
  <text x="60" y="140" fill="#DC2626" font-size="14">crop_domain 后</text>
  <text x="60" y="158" fill="#DC2626" font-size="14">小图 (0,0) 就在这</text>
  <!-- 底注 -->
  <text x="10" y="472" fill="#0F172A" font-size="15" font-weight="bold">smallest_rectangle1 返回左上角 (Row1=178, Col1=179) —— 这就是 OffsetRow / OffsetCol 端口的值（源码 :466-469）</text>
  <text x="10" y="494" fill="#475569" font-size="14">crop_domain 裁走蓝框、不旋转图像 → 回变换永远只需平移：全局 = 本地 + (Row1, Col1)</text>
</svg>
