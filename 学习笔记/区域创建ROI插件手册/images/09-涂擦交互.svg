<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="780" height="400" fill="#FDFDFB"/>
  <!-- ① 画笔涂橙 -->
  <text x="30" y="30" fill="#0F172A" font-size="15" font-weight="bold">① 绘制涂抹（橙 = 补充区域）</text>
  <rect x="30" y="46" width="220" height="160" fill="#C8CDD4"/>
  <circle cx="100" cy="110" r="34" fill="#9AA3AD"/>
  <path d="M150,80 C180,90 200,120 190,160 C170,150 150,140 140,110 Z" fill="#F59E0B" fill-opacity="0.75" stroke="#D97706" stroke-width="2"/>
  <text x="34" y="228" fill="#475569" font-size="12.5">反光面/变化区涂掉 —— 不参与学习/检测</text>
  <!-- ② 擦除 -->
  <text x="290" y="30" fill="#0F172A" font-size="15" font-weight="bold">② 擦除涂抹（红 = 挖掉）</text>
  <rect x="290" y="46" width="220" height="160" fill="#C8CDD4"/>
  <circle cx="360" cy="110" r="34" fill="#9AA3AD"/>
  <path d="M410,80 C440,90 460,120 450,160 C430,150 410,140 400,110 Z" fill="#F59E0B" fill-opacity="0.75" stroke="#D97706" stroke-width="2"/>
  <path d="M420,95 C440,110 445,135 428,152" fill="none" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <text x="294" y="228" fill="#475569" font-size="12.5">涂多了用「擦除涂抹」找回（红笔画过的不算）</text>
  <!-- ③ 合并口径 -->
  <text x="550" y="30" fill="#0F172A" font-size="15" font-weight="bold">③ 对合并区域的作用</text>
  <rect x="550" y="46" width="200" height="160" fill="#C8CDD4"/>
  <circle cx="620" cy="110" r="34" fill="#9AA3AD"/>
  <path d="M660,84 C690,94 710,124 700,164 C680,154 660,144 650,114 Z" fill="#F59E0B" fill-opacity="0.75"/>
  <path d="M700,100 C686,120 672,140 656,158" fill="none" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <text x="552" y="228" fill="#475569" font-size="12.5">合并有效区域 = (所有ROI ∪ 涂抹) − 擦除</text>
  <!-- 持久化 -->
  <rect x="20" y="252" width="740" height="60" rx="4" fill="#F0F7FF" stroke="#93C5FD"/>
  <text x="32" y="274" fill="#1E40AF" font-size="13" font-weight="bold">持久化：区域 → 游程编码文本（超 4KB 自动「gz:」+ base64）→ 随方案落盘 → 重开界面 RestoreSmear 原样恢复</text>
  <text x="32" y="296" fill="#475569" font-size="12.5">恢复必须「直接写字段」而不是走 setter —— 否则联动逻辑会把另一边尚未恢复的快照重新编码（真实事故，见 5.8 节）</text>
  <!-- 底注 -->
  <text x="20" y="340" fill="#0F172A" font-size="13.5" font-weight="bold">同一套涂擦范式三处共用：创建 ROI（区域拼挖）、模板匹配（涂抹排除域）、区域颜色检查</text>
  <text x="20" y="362" fill="#475569" font-size="13">画布能力全部来自 Core.Halcon 的 ImageEdit 控件；画布与参数双向同步走「单一数据源 + 断环」范式（ROI 手册 5.4/5.5 节）</text>
  <text x="20" y="384" fill="#64748B" font-size="12.5">区分「用户真实操作」与「程序回灌」：200ms 防抖、_seedingCanvas 守卫、RestoreSmear 直写字段 —— 三处同一思想</text>
</svg>
