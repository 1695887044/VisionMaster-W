<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="640" height="420" fill="#FDFDFB"/>
  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <!-- 图像平面 -->
  <rect x="70" y="50" width="440" height="300" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="110" y1="50" x2="110" y2="350"/><line x1="150" y1="50" x2="150" y2="350"/><line x1="190" y1="50" x2="190" y2="350"/><line x1="230" y1="50" x2="230" y2="350"/><line x1="270" y1="50" x2="270" y2="350"/><line x1="310" y1="50" x2="310" y2="350"/><line x1="350" y1="50" x2="350" y2="350"/><line x1="390" y1="50" x2="390" y2="350"/><line x1="430" y1="50" x2="430" y2="350"/><line x1="470" y1="50" x2="470" y2="350"/>
    <line x1="70" y1="90" x2="510" y2="90"/><line x1="70" y1="130" x2="510" y2="130"/><line x1="70" y1="170" x2="510" y2="170"/><line x1="70" y1="210" x2="510" y2="210"/><line x1="70" y1="250" x2="510" y2="250"/><line x1="70" y1="290" x2="510" y2="290"/><line x1="70" y1="330" x2="510" y2="330"/>
  </g>
  <!-- 坐标轴 -->
  <line x1="70" y1="50" x2="530" y2="50" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arB)"/>
  <line x1="70" y1="50" x2="70" y2="365" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arB)"/>
  <text x="230" y="38" fill="#2563EB" font-size="15" font-weight="bold">Column 列（x 方向，往右）</text>
  <text x="80" y="384" fill="#2563EB" font-size="15" font-weight="bold">Row 行（y 方向，往下）</text>
  <circle cx="70" cy="50" r="4" fill="#DC2626"/>
  <text x="80" y="72" fill="#DC2626" font-size="14">(0,0) 原点在左上角</text>
  <!-- 示例点 (Row=200, Column=240) -->
  <line x1="70" y1="250" x2="310" y2="250" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="310" y1="50" x2="310" y2="250" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="310" cy="250" r="5" fill="#DC2626"/>
  <text x="130" y="242" fill="#DC2626" font-size="14">Row = 200</text>
  <text x="318" y="120" fill="#DC2626" font-size="14">Column = 240</text>
  <text x="318" y="272" fill="#DC2626" font-size="15" font-weight="bold">(Row=200, Column=240) ← 先行后列!</text>
  <text x="70" y="408" fill="#475569" font-size="15">记忆口诀：写坐标永远先 Row（行 · 竖直 y）后 Column（列 · 水平 x）—— 是 (y, x) 而不是 (x, y)</text>
</svg>
