<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>流程胶囊条 · 设计基线 v2</title>
<style>
  :root {
    /* ---- 令牌：与 UI/Controls/Themes/Colors.xaml 一一对应 ---- */
    --accent: #0EA5E9;              /* DialogAccentBrush */
    --accent-dark: #0284C7;         /* DialogAccentDarkBrush */
    --accent-soft: #F0F9FF;         /* DialogAccentSoftBrush */
    --accent-text: #0369A1;         /* DialogAccentTextBrush */

    --surface: #FFFFFF;             /* DialogSurfaceBrush */
    --surface-2: #F8FAFC;           /* DialogRowAlternateBrush */
    --background: #EEF2F7;          /* DialogBackgroundBrush（设计稿外壳） */
    --border: #E2E8F0;              /* DialogBorderBrush */
    --border-light: #EEF2F7;        /* DialogBorderLightBrush */
    --border-strong: #CBD5E1;       /* DialogBorderStrongBrush */

    --text-1: #0F172A;              /* DialogTextPrimaryBrush */
    --text-2: #475569;              /* DialogTextSecondaryBrush */
    --text-3: #64748B;              /* DialogTextTertiaryBrush */
    --text-4: #94A3B8;              /* DialogTextMutedBrush */

    --success: #22C55E;             /* FlowCanvasSuccessBrush */
    --success-text: #15803D;        /* DialogSuccessTextBrush */
    --danger-text: #B91C1C;         /* DialogDangerTextBrush */
    --danger-subtle: #FEF2F2;       /* DialogDangerSubtleBrush */
    --danger-border: #FECACA;       /* DialogDangerBorderBrush */
    --disabled: #C0C4CC;            /* ScadaDisabledTextBrush */

    --row-hover: #F1F5F9;           /* DialogRowHoverBrush */
    --selected-soft: #EEF2FF;       /* LogicIfSoftBrush */
    --selected-border: #C7D2FE;     /* LogicIfBorderBrush */
    --selected-text: #4338CA;       /* LogicIfTextBrush */

    /* 角色徽标：复用逻辑容器族（不新增键） */
    --role-home-fg: #6D28D9;        /* LogicCaseTextBrush */
    --role-home-bg: #F5F3FF;        /* LogicCaseSoftBrush */
    --role-home-bd: #DDD6FE;        /* LogicCaseBorderBrush */
    --role-main-fg: #4338CA;        /* LogicIfTextBrush */
    --role-main-bg: #EEF2FF;        /* LogicIfSoftBrush */
    --role-main-bd: #C7D2FE;        /* LogicIfBorderBrush */
    --role-end-fg: #B45309;         /* LogicWhileTextBrush */
    --role-end-bg: #FFFBEB;         /* LogicWhileSoftBrush */
    --role-end-bd: #FDE68A;         /* LogicWhileBorderBrush */

    --radius-sm: 6px;
    --radius-md: 8px;

    --font: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--background);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-1);
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 22px;
  }

  .wrap { display: flex; flex-direction: column; gap: 8px; }
  .wrap .meta {
    font-size: 11px;
    color: var(--text-3);
    font-family: var(--mono);
    padding-left: 2px;
  }
  .wrap .meta b { color: var(--text-1); }

  /* 宿主真实尺寸：ProcessView.xaml:290 → FlowListView Height=112；
     Shell.xaml:1052 → 左栏 DockWidth=340 / DockMinWidth=320 */
  .panel {
    width: 340px;
    height: 112px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 14px rgba(15,23,42,.08);
  }

  /* ============ 胶囊条：单行紧凑式（112px 只能这么排） ============ */
  .strip { padding: 6px 6px 0; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

  /* 单行胶囊：22px 高。3 行 × 22 + 2 间距 4 = 74，加 padding 6 + 底栏 26 = 106 ≤ 112 */
  .capsule {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease;
  }
  .capsule:hover { background: var(--row-hover); border-color: var(--border-strong); }
  .capsule:active { background: var(--border-light); }
  .capsule:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .capsule[aria-pressed="true"] {
    background: var(--selected-soft);
    border-color: var(--selected-border);
  }

  /* 状态点：只表达"启用 / 禁用"，不兼任运行态 */
  .capsule .dot {
    flex: 0 0 auto;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .capsule .name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 11.5px;
    line-height: 1.2;
    color: var(--text-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .capsule[aria-pressed="true"] .name { font-weight: 600; }

  .capsule .steps {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    color: var(--text-3);
    line-height: 1;
  }

  /* 运行标记：单行式下压成一个小三角/点，不占文字位；语义靠颜色 + ToolTip */
  .capsule .run {
    flex: 0 0 auto;
    display: none;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 2px rgba(34,197,94,.22);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .capsule[data-run="running"] .name { font-weight: 600; }
  .capsule[data-run="running"] .run { display: block; }
  .capsule[data-run="paused"] .name { font-weight: 600; }
  .capsule[data-run="paused"] .dot { background: var(--accent); }
  .capsule[data-run="paused"] .run { display: block; background: var(--accent); box-shadow: 0 0 0 2px rgba(14,165,233,.22); }

  /* 禁用：点灰 + 名称删除线 + 去饱和。运行标记强制隐藏（禁用流程不可能在跑） */
  .capsule[data-enabled="false"] { background: var(--surface-2); }
  .capsule[data-enabled="false"] .dot { background: var(--disabled); }
  .capsule[data-enabled="false"] .name {
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-color: var(--text-4);
  }
  .capsule[data-enabled="false"] .steps { color: var(--disabled); }
  .capsule[data-enabled="false"] .run { display: none !important; }

  /* 角色徽标：单行式下压到 9px、只留一个字，完整名称进 ToolTip */
  .role {
    flex: 0 0 auto;
    font-size: 9px;
    line-height: 1.4;
    padding: 0 3px;
    border-radius: 2px;
    border: 1px solid;
    white-space: nowrap;
  }
  .role.home { color: var(--role-home-fg); background: var(--role-home-bg); border-color: var(--role-home-bd); }
  .role.main { color: var(--role-main-fg); background: var(--role-main-bg); border-color: var(--role-main-bd); }
  .role.end  { color: var(--role-end-fg); background: var(--role-end-bg); border-color: var(--role-end-bd); }

  /* ============ 底栏 ============ */
  .footbar {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 26px;
    padding: 0 8px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    font-size: 10.5px;
    color: var(--text-3);
  }
  .footbar .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text-1); font-weight: 600; }
  .spacer { flex: 1 1 auto; }

  /* ============ 滚动档：流程多于此数时滚动（不裁底栏） ============ */
  .scrollable .grid { max-height: 74px; overflow-y: auto; }

  /* ============ 提示条（选中禁用流程） ============ */
  .notice {
    display: none;
    align-items: center;
    gap: 5px;
    margin: 4px 6px 0;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--danger-subtle);
    border: 1px solid var(--danger-border);
    font-size: 10px;
    color: var(--danger-text);
    line-height: 1.4;
    /* 340 宽下必须单行省略：文案完整版在 ToolTip，面板里不换行（换行会吃掉胶囊区高度） */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notice .txt { overflow: hidden; text-overflow: ellipsis; }
  .show-notice .notice { display: flex; }
  /* 提示条占约 24px（外边距 4 + 边框 2 + 内边距 4 + 行高 14），胶囊区让位到 48px。
     112 - 2(面板边框) - 6(上内距) - 24(提示条) - 26(底栏) = 54，取 48 = 两行完整（22+4+22）。 */
  .show-notice .grid { max-height: 48px; overflow-y: auto; }

  /* ============ 右键菜单（浮层，不占面板高度） ============ */
  .menu {
    width: 200px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 22px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.06);
    font-size: 12px;
  }
  .menu .item {
    display: flex; align-items: center; gap: 7px;
    height: 27px; padding: 0 7px;
    border-radius: 4px;
    color: var(--text-2);
    cursor: pointer;
  }
  .menu .item .ic { width: 13px; text-align: center; color: var(--text-4); font-size: 10.5px; }
  .menu .item:hover { background: var(--row-hover); color: var(--text-1); }
  .menu .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .menu .item.danger:hover { background: var(--danger-subtle); color: var(--danger-text); }
  .menu .item.danger .ic { color: var(--danger-text); }
  .menu .sep { height: 1px; margin: 3px 5px; background: var(--border-light); }
  .menu .sub {
    display: flex; align-items: center; gap: 7px;
    height: 27px; padding: 0 7px;
    border-radius: 4px; color: var(--text-2); cursor: pointer;
  }
  .menu .sub:hover { background: var(--row-hover); }
  .menu .sub:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .menu .sub .ic { width: 13px; text-align: center; color: var(--text-4); font-size: 10.5px; }
  .menu .sub .arrow { margin-left: auto; color: var(--text-4); font-size: 9px; }
  /* 子菜单展开态：与父项右侧平齐 */
  .menu .flyout {
    margin: 2px 0 2px 20px;
    padding-left: 6px;
    border-left: 1px solid var(--border-light);
  }

  /* ============ 演示控制 ============ */
  .demo {
    position: fixed; right: 20px; bottom: 20px;
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px;
    background: rgba(15,23,42,.88);
    border-radius: var(--radius-md);
    color: #fff; font-size: 12px;
  }
  .demo button {
    height: 24px; padding: 0 10px;
    border: 0; border-radius: var(--radius-sm);
    background: rgba(255,255,255,.16); color: #fff;
    font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .demo button:hover { background: rgba(255,255,255,.28); }
</style>
</head>
<body>

<!-- ================= 1. 默认态（6 条流程，3 行，正好不滚动） ================= -->
<div class="wrap">
  <div class="panel" id="p1">
    <div class="strip">
      <div class="grid">
        <button class="capsule" aria-pressed="false" data-enabled="true" title="回原点 · 6 步 · 回零流程">
          <span class="dot"></span>
          <span class="name">回原点</span>
          <span class="role home" title="回零（Home）">零</span>
          <span class="steps">6</span>
        </button>

        <button class="capsule" aria-pressed="true" data-enabled="true" data-run="running" title="主检测 · 18 步 · 运行中">
          <span class="dot"></span>
          <span class="name">主检测</span>
          <span class="role main" title="主任务（Main）">主</span>
          <span class="run"></span>
          <span class="steps">18</span>
        </button>

        <button class="capsule" aria-pressed="false" data-enabled="true" data-run="paused" title="定位检测 · 11 步 · 已暂停">
          <span class="dot"></span>
          <span class="name">定位检测</span>
          <span class="run"></span>
          <span class="steps">11</span>
        </button>

        <button class="capsule" aria-pressed="false" data-enabled="true" title="缺陷复判 · 9 步">
          <span class="dot"></span>
          <span class="name">缺陷复判</span>
          <span class="steps">9</span>
        </button>

        <button class="capsule" aria-pressed="false" data-enabled="false" title="数据上报 · 4 步 · 已禁用">
          <span class="dot"></span>
          <span class="name">数据上报</span>
          <span class="steps">4</span>
        </button>

        <button class="capsule" aria-pressed="false" data-enabled="true" title="收尾 · 5 步 · 收尾流程">
          <span class="dot"></span>
          <span class="name">收尾</span>
          <span class="role end" title="收尾（End）">尾</span>
          <span class="steps">5</span>
        </button>
      </div>
    </div>
    <div class="footbar">
      <span><b class="mono">6</b> 条流程</span>
      <span class="spacer"></span>
      <span>选中：主检测</span>
    </div>
  </div>
  <div class="meta">默认态 · <b>340 × 112</b>（宿主真实尺寸）· 6 条 3 行不滚动</div>
</div>

<!-- ================= 2. 超量滚动（10 条流程） ================= -->
<div class="wrap">
  <div class="panel scrollable" id="p2">
    <div class="strip">
      <div class="grid">
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">回原点</span><span class="role home">零</span><span class="steps">6</span></button>
        <button class="capsule" aria-pressed="true" data-enabled="true" data-run="running"><span class="dot"></span><span class="name">主检测</span><span class="role main">主</span><span class="run"></span><span class="steps">18</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">定位检测</span><span class="steps">11</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">缺陷复判</span><span class="steps">9</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="false"><span class="dot"></span><span class="name">数据上报</span><span class="steps">4</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">收尾</span><span class="role end">尾</span><span class="steps">5</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">二次复判</span><span class="steps">7</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">标定补偿</span><span class="steps">3</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">清洁提示</span><span class="steps">2</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">班次统计</span><span class="steps">4</span></button>
      </div>
    </div>
    <div class="footbar">
      <span><b class="mono">10</b> 条流程</span>
      <span class="spacer"></span>
      <span>选中：主检测</span>
    </div>
  </div>
  <div class="meta">超量态 · <b>340 × 112</b> · 胶囊区滚动，底栏固定</div>
</div>

<!-- ================= 3. 选中禁用流程 → 提示条（挤压胶囊区，不溢出） ================= -->
<div class="wrap">
  <div class="panel show-notice" id="p3">
    <div class="strip">
      <div class="grid">
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">回原点</span><span class="role home">零</span><span class="steps">6</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">主检测</span><span class="role main">主</span><span class="steps">18</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">定位检测</span><span class="steps">11</span></button>
        <button class="capsule" aria-pressed="true" data-enabled="false"><span class="dot"></span><span class="name">数据上报</span><span class="steps">4</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">收尾</span><span class="role end">尾</span><span class="steps">5</span></button>
        <button class="capsule" aria-pressed="false" data-enabled="true"><span class="dot"></span><span class="name">缺陷复判</span><span class="steps">9</span></button>
      </div>
    </div>
    <div class="notice" title="已禁用：不参与自动触发，右键「启用」后才能运行"><span>⚠</span><span class="txt">已禁用：右键「启用」后才能运行</span></div>
    <div class="footbar">
      <span><b class="mono">6</b> 条流程</span>
      <span class="spacer"></span>
      <span>选中：数据上报</span>
    </div>
  </div>
  <div class="meta">禁用提示 · <b>340 × 112</b> · 提示条 20px，胶囊区让位滚动</div>
</div>

<!-- ================= 4. 右键菜单（浮层） ================= -->
<div class="wrap">
  <div class="menu">
    <div class="sub" tabindex="0"><span class="ic">◈</span><span>流程</span><span class="arrow">▸</span></div>
    <div class="flyout">
      <div class="item" tabindex="0"><span class="ic">＋</span>添加</div>
      <div class="item danger" tabindex="0"><span class="ic">✕</span>删除</div>
      <div class="item" tabindex="0"><span class="ic">✎</span>重命名</div>
      <div class="item" tabindex="0"><span class="ic">≡</span>编辑注释</div>
      <div class="sep"></div>
      <div class="item" tabindex="0"><span class="ic">⊘</span>禁用此流程</div>
      <div class="item" tabindex="0"><span class="ic">⚙</span>编译本流程</div>
      <div class="sep"></div>
      <div class="item" tabindex="0"><span class="ic">▶</span>运行一次</div>
      <div class="item" tabindex="0"><span class="ic">↻</span>循环运行</div>
      <div class="item" tabindex="0"><span class="ic">■</span>停止本流程</div>
    </div>
    <div class="sep"></div>
    <div class="item" tabindex="0"><span class="ic">☰</span>流程管理</div>
    <div class="item" tabindex="0"><span class="ic">◆</span>变量事件（方案级）</div>
  </div>
  <div class="meta">右键菜单 · 浮层 200px · 结构同现状（流程子菜单 + 2 项平铺）</div>
</div>

<!-- 演示控制 -->
<div class="demo">
  <span>演示控制</span>
  <button onclick="document.getElementById('p1').classList.toggle('show-notice')">提示条</button>
  <button onclick="document.getElementById('p2').classList.toggle('scrollable')">滚动</button>
</div>

<script>
  // 胶囊单选（演示）
  document.querySelectorAll('#p1 .capsule').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('#p1 .capsule').forEach(x => x.setAttribute('aria-pressed','false'));
      c.setAttribute('aria-pressed','true');
    });
  });
</script>
</body>
</html>
